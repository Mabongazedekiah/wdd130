<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic html and Css Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>✅Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <div class="item">
            <label for="q1"><span>1.</span> What does the acronym CSS stands for?</label>
            <input type="text" id="q1" name="q1" required>
            </div>
            <div class="item">
            <label for="q2"><span>2.</span> How are id and class attributes selected in CSS?</label>
            <textarea id="q2" name="q2" rows="5" required></textarea>
            </div>
            <div class="item">
            <label for="q3"><span>3.</span> Which of the following is a valid CSS comment?</label>
            <select id="q3" name="q3" required>
                <option value="" selected disabled>Select an answer</option>
                <option value="a">A./* This is a comment */</option>
                <option value="b">B.// This is a comment</option>
                <option value="c">C.# This is a comment</option>
            </select>
            <div class="item">
            <div class="item last" >
            <label for="q4"><span>4.</span> What is the bottom margin given this declaration?</label>
            <code>margin: 10px 5px 15px;</code>
            <input type="text" id="q4" name="q4" required>
            </div>
            <div class="item">
            <button type="submit">Submit Quiz For Grading</button>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy;2026 Basic HTML and CSS Quiz. All rights reserved.</p>
    </footer>  
</body>
</html>
